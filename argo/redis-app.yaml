
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-simple
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jqfelipe/redis-argo-simple.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-simple
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
